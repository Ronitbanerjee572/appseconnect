<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Multi-Agent Studio</title>
    <style>
        :root {
            --bg-color: #0b0c0e;
            --card-bg: #13151a;
            --text-color: #e2e8f0;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --border-color: #22252e;
            --terminal-bg: #07080a;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.2rem;
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 520px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 0.25rem;
            color: #ffffff;
            font-size: 1.6rem;
            text-align: center;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 1.75rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input,
        textarea {
            width: 100%;
            padding: 0.8rem;
            background-color: #1c1f26;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        button {
            width: 100%;
            padding: 0.85rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 0.5rem;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #334155;
            color: #64748b;
            cursor: not-allowed;
        }

        .terminal {
            margin-top: 1.5rem;
            background-color: var(--terminal-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            max-height: 180px;
            overflow-y: auto;
            display: none;
        }

        .terminal-line {
            margin-bottom: 0.4rem;
            line-height: 1.4;
        }

        .system {
            color: #a78bfa;
        }

        .success {
            color: #34d399;
        }

        .error {
            color: #f87171;
        }

        .warning {
            color: #f59e0b;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Multi-Agent AI Workspace</h2>
        <div class="subtitle">Dynamic Document Compilation & Graphics Matrix</div>

        <form id="agentForm">
            <div class="form-group">
                <label for="userKey">Security Verification Token</label>
                <input type="password" id="userKey" placeholder="Paste security token to authenticate..." required>
            </div>

            <div class="form-group">
                <label for="userEmail">Notification Email Address</label>
                <input type="email" id="userEmail" placeholder="name@domain.com" required>
            </div>

            <div class="form-group">
                <label for="submitDate">Project Submission Date</label>
                <input type="date" id="submitDate" required>
            </div>

            <div class="form-group">
                <label for="topic">Research Core Topic</label>
                <textarea id="topic"
                    placeholder="e.g., The evolution of clean energy distribution grids in smart cities..."
                    required></textarea>
            </div>

            <button type="submit" id="submitBtn">Deploy Agents Pipeline</button>
        </form>

        <div class="terminal" id="processTerminal"></div>
    </div>

    <script>
        document.getElementById('submitDate').value = new Date().toISOString().split('T')[0];

        // CONFIGURATION: Replace with your actual live Render Web Service URL
        const RENDER_PROXY_URL = "https://your-render-app-url.onrender.com/api/generate";
        const DIRECT_WEBHOOK_URL = "https://webhook.appse.ai/webhooks/test/b70fd17a-0a14-404f-9aaa-27ab9bcdd286";

        const terminal = document.getElementById('processTerminal');

        function logToTerminal(text, type = '') {
            const line = document.createElement('div');
            line.className = `terminal-line ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            line.innerText = `[${timestamp}] ${text}`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        document.getElementById('agentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const topicValue = document.getElementById('topic').value;
            const emailValue = document.getElementById('userEmail').value;
            const dateValue = document.getElementById('submitDate').value;

            // GENERATE TOKEN HERE: Creating the unique transaction identifier on the frontend
            const generatedTxId = `tx_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;

            const payload = {
                transaction_id: generatedTxId, // Sending the token right from the start!
                verification_key: document.getElementById('userKey').value,
                topic: topicValue,
                target_email: emailValue,
                submit_date: dateValue
            };

            submitBtn.disabled = true;
            submitBtn.innerText = "Processing Sequence...";
            terminal.innerHTML = '';
            terminal.style.display = "block";

            logToTerminal("Establishing link connection to Proxy Server Core...", "system");

            try {
                // Primary Route: Express Proxy Server
                const response = await fetch(RENDER_PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Proxy responded with status code ${response.status}`);
                }

                const rawData = await response.json();

                if (rawData && rawData.report_data) {
                    const fileMeta = rawData.report_data;
                    const base64String = fileMeta.base64_data;
                    const fileName = fileMeta.file_name;

                    logToTerminal(`Synchronous File Package Returned: "${fileName}"`, "success");
                    logToTerminal("Injecting document payload stream into local browser link...", "system");

                    const downloadLink = document.createElement("a");
                    downloadLink.href = `data:text/html;base64,${base64String}`;
                    downloadLink.download = fileName;

                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);

                    logToTerminal("Automatic document generation download completed!", "success");
                }
                logToTerminal("Process Lifecycle Completed successfully.", "success");

            } catch (primaryError) {
                // Fallback Route: Direct to Webhook if proxy is down
                logToTerminal(`Direct streaming download unavailable: ${primaryError.message}`, "warning");
                logToTerminal("Activating asynchronous failover engine layer...", "system");
                logToTerminal("Rerouting data payload natively to direct webhook...", "system");

                try {
                    await fetch(DIRECT_WEBHOOK_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    logToTerminal("Fallback handshake successfully established with automation gateway.", "success");
                    logToTerminal("Background agent thread groups running active tasks...", "success");

                    setTimeout(() => {
                        logToTerminal("Writer Agent running: Compiling master publication dossier...", "system");
                    }, 1000);

                    setTimeout(() => {
                        logToTerminal("Master Document compiled successfully.", "success");
                        logToTerminal(`Outbound SMTP Gate fired: Report dispatched to ${emailValue}`, "success");
                        logToTerminal("Process completed. Check your Gmail address in a few moments!", "success");
                    }, 2500);

                } catch (fallbackError) {
                    logToTerminal(`Critical System Fault: ${fallbackError.message}`, "error");
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Deploy Agents Pipeline";
            }
        });
    </script>

</body>

</html>
